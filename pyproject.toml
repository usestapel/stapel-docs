[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-docs"
version = "0.7.0"
description = "Documents: storage, revisions and per-type editors for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Floor raised to 0.24.0 by this module's own security posture, not by a
    # new API call. `docs_settings` declares `import_strings=("STORAGE",)`,
    # and before core 0.24.0 an `AppSettings` import-string key was still
    # resolved from the environment unless the module remembered to list it
    # in `no_env` — which this one did not. So a bare `STORAGE` environment
    # variable could choose the storage class this package loads. That is
    # what the DOCS-03 download-URL gate rests on: the endpoints refuse
    # unless the configured backend advertises `mints_expiring_urls = True`,
    # so an env-selected backend is an env-selected answer to "may I hand
    # out permanent public links". Core 0.24.0 makes every `import_strings`
    # key implicitly `no_env` (opt out per key with `env_overridable=`), so
    # the storage class comes from the project's settings or the default and
    # nowhere else. On an older core the check is decorative, hence a floor
    # rather than a preference.
    #
    # Previously >=0.15.11 — a floor measured green against 0.15.11, 0.16.0
    # and 0.18.0 on 2026-08-10, itself replacing the scaffold placeholder
    # (>=0.3,<0.4) that made the package uninstallable next to any real host.
    # Floor: 0.26.0 emits docs/errors.json with the `owner` field the
    # committed artifact and its drift gate require.
    # Floor: 0.27.0 registers `error.503.mandate_unavailable` (+ ru/es
    # catalogs) — CI always installs core off git HEAD, so the committed
    # docs/errors.json (regenerated against the current core) needs the
    # floor to match or a consumer on an older core silently regenerates a
    # smaller artifact and the drift gate goes red again.
    "stapel-core>=0.27.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-docs"
Repository = "https://github.com/usestapel/stapel-docs"
Documentation = "https://github.com/usestapel/stapel-docs#readme"
Changelog = "https://github.com/usestapel/stapel-docs/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-docs/issues"

[project.optional-dependencies]
s3 = ["boto3>=1.26"]
# `markdown` joined the [pdf] extra in 0.4.1: an md document exports as
# rendered structure, which needs a parser. Missing it raises
# ExporterUnavailable (-> 503) rather than degrading to the pre-0.4.1
# verbatim print, so a partial install is visible instead of silently
# producing PDFs full of literal `#` and `**`.
pdf = ["fpdf2>=2.8", "markdown>=3.4"]
# Server-side image thumbnails (drive wave, 0.5.0). Optional on purpose: a
# deployment that never previews images should not carry an image codec, and
# its absence is a visible 503 on the thumbnail endpoint rather than a
# silently missing feature.
thumbnails = ["Pillow>=10"]
# The Yjs codec (0.7.0): the builtin crdt types (ymd/ytxt), server snapshot
# assembly and the write-door apply-validation all live behind this import.
# Optional on purpose — without it the crdt builtins simply do not register
# and nothing else changes; the journal substrate keeps serving host-codec
# crdt types either way. Ceiling <0.15: the codec's wire form of "nothing"
# (crdt.EMPTY_STATE) is pinned by a test, so the floor/ceiling move together
# with a verified run, never by resolver drift. Tested against 0.14.4.
crdt = ["pycrdt>=0.12,<0.15"]
# The WebSocket delivery of the update journal (0.7.0). An extra and not a
# dependency — deliberately unlike stapel-chat, where realtime is the
# product: here polling ?since= is first-class forever (design §5.3 p.7),
# so a half-wired install is a warning (stapel_docs.W034), never a failed
# check. [channels] because serving the socket is what the extra is FOR;
# emit-only delivery would ride the same package anyway.
realtime = ["stapel-realtime[channels]>=0.1.2,<1.0"]
all = [
    "boto3>=1.26",
    "fpdf2>=2.8",
    "markdown>=3.4",
    "Pillow>=10",
    "pycrdt>=0.12,<0.15",
    "stapel-realtime[channels]>=0.1.2,<1.0",
]

[tool.setuptools]
package-dir = {"stapel_docs" = "."}
packages = ["stapel_docs", "stapel_docs.migrations", "stapel_docs.management", "stapel_docs.management.commands"]

[tool.setuptools.package-data]
# The contract documents ship IN THE WHEEL: that is what makes
# `stapel-catalog --from-installed` possible, i.e. what turns catalog
# freshness from somebody's discipline into a property of the lockfile.
# A module that keeps them repo-only publishes code an agent cannot read.
# NOTE: docs/llms.txt, translations/ and templates/ are listed explicitly —
# the stapel-new-library template omits them (defect reported upstream to
# stapel_tools/_library_templates.py); four libraries shipped catalogues
# that never reached the wheel because of exactly this.
# `translations/.state.json` is listed separately: a leading dot is not
# matched by `translations/*.json`, and the provenance sidecar is what makes
# a downstream regeneration a no-op instead of a re-translation.
stapel_docs = ["py.typed", "docs/capabilities.json", "docs/flows.json", "docs/errors.json", "docs/llms.txt", "CONFIG.MD", "migrations/*.py", "schemas/**/*.json", "translations/*.json", "translations/.state.json", "templates/**/*", "assets/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-docs"
version = "0.1.0"
description = "Documents: storage, revisions and per-type editors for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "docs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "stapel-core>=0.3.0,<0.4",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-docs"
Repository = "https://github.com/usestapel/stapel-docs"
Documentation = "https://github.com/usestapel/stapel-docs#readme"
Changelog = "https://github.com/usestapel/stapel-docs/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-docs/issues"

[project.optional-dependencies]
s3 = ["boto3>=1.26"]
pdf = ["fpdf2>=2.8"]
all = ["boto3>=1.26", "fpdf2>=2.8"]

[tool.setuptools]
package-dir = {"stapel_docs" = "."}
packages = ["stapel_docs", "stapel_docs.migrations", "stapel_docs.management", "stapel_docs.management.commands"]

[tool.setuptools.package-data]
# The contract documents ship IN THE WHEEL: that is what makes
# `stapel-catalog --from-installed` possible, i.e. what turns catalog
# freshness from somebody's discipline into a property of the lockfile.
# A module that keeps them repo-only publishes code an agent cannot read.
# NOTE: docs/llms.txt, translations/ and templates/ are listed explicitly —
# the stapel-new-library template omits them (defect reported upstream to
# stapel_tools/_library_templates.py); four libraries shipped catalogues
# that never reached the wheel because of exactly this.
stapel_docs = ["py.typed", "docs/capabilities.json", "docs/flows.json", "docs/errors.json", "docs/llms.txt", "CONFIG.MD", "migrations/*.py", "schemas/**/*.json", "translations/*.json", "templates/**/*", "assets/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
